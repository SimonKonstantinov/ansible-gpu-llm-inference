---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [base]

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
      - python3-pip
      - ufw
    state: present
  tags: [base]

- name: Set timezone to Europe/Moscow
  ansible.builtin.command: timedatectl set-timezone Europe/Moscow
  changed_when: false
  failed_when: false
  tags: [base]

- name: Ensure UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny
  tags: [base]

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ ufw_allow_ssh_from }}"
  tags: [base]

- name: Allow reverse proxy port when enabled
  community.general.ufw:
    rule: allow
    port: "{{ reverse_proxy_listen_port }}"
    proto: tcp
  when: enable_reverse_proxy | bool
  tags: [base]

- name: Enable UFW
  community.general.ufw:
    state: enabled
  tags: [base]
