---
- name: Create monitoring directory
  ansible.builtin.file:
    path: "{{ monitoring_compose_dir }}"
    state: directory
    mode: "0755"
  tags: [monitoring]

- name: Deploy node_exporter compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_compose_dir }}/docker-compose.yml"
    mode: "0644"
  tags: [monitoring]

- name: Start monitoring stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ monitoring_compose_dir }}"
  changed_when: true
  tags: [monitoring]

- name: Note on GPU metrics
  ansible.builtin.debug:
    msg: >-
      Для GPU добавьте nvidia-dcgm-exporter или скрейп nvidia-smi через textfile collector.
      node_exporter слушает 127.0.0.1:{{ node_exporter_port }}.
  tags: [monitoring]
