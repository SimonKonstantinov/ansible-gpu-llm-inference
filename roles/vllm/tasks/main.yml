---
- name: Create vLLM compose directory
  ansible.builtin.file:
    path: "{{ vllm_compose_dir }}"
    state: directory
    mode: "0755"
  tags: [vllm]

- name: Deploy docker-compose for vLLM
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vllm_compose_dir }}/docker-compose.yml"
    mode: "0644"
  tags: [vllm]

- name: Deploy vLLM systemd unit
  ansible.builtin.template:
    src: vllm.service.j2
    dest: /etc/systemd/system/vllm-compose.service
    mode: "0644"
  tags: [vllm]

- name: Enable and start vLLM via systemd
  ansible.builtin.systemd:
    name: vllm-compose.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [vllm]
